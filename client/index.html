<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>
    // Apply the saved (or system) theme before first paint to avoid a flash.
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GDG on Campus · Bengal Institute of Technology</title>
  <meta name="description"
    content="Google Developer Groups on Campus Bengal Institute of Technology: a student community for learning Google technologies, building projects and growing together. #GDGOnCampus" />
  <meta name="theme-color" content="#f0f0f0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
  <meta property="og:title" content="GDG on Campus · Bengal Institute of Technology" />
  <meta property="og:description" content="Workshops, study jams, hackathons and a friendly crowd of student developers at BIT Kolkata." />
  <meta property="og:image" content="/brand/gdg-mark-256.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" type="image/png" href="/brand/favicon.png">
  <link rel="apple-touch-icon" href="/brand/gdg-mark-256.png">

  <!-- Brand font: Latin-subset WOFF2 (11 KB each). Preload the two weights used above the fold. -->
  <link rel="preload" href="/fonts/GoogleSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/GoogleSans-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Mono font for the terminal and labels. Non-blocking: the page renders first, the font swaps in. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500&display=swap"></noscript>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
